server {
  listen 80;
  root /usr/share/nginx/html;

  # Güvenlik başlıkları: nginx'te bir location kendi add_header'ını tanımlayınca üst düzeydekiler
  # DEVRALINMAZ (eskiden bu yüzden hiçbiri gönderilmiyordu). Bu yüzden her location'da `include`.
  #
  # CSP: panel kendi derlenmiş dosyalarından çalışır (satır içi betik yok) → betik yalnız 'self'.
  # API ve gerçek zamanlı bağlantı api.letstalkin.com; görseller kendi medya alanı, TMDB, YouTube.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: blob:; font-src 'self' data:; connect-src 'self' https://api.letstalkin.com wss://api.letstalkin.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'";

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/conf.d/security-headers.inc;
  }
  # Tek sayfa uygulama: bilinmeyen yollar index.html'e.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/conf.d/security-headers.inc;
  }
}
